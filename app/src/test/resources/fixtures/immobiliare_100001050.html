ain": true, "ga4features": ["balcone", "infissi esterni in vetro / legno", "esposizione doppia"], "id": "11775002", "availability": "libero", "bathrooms": "2", "buildingYear": 1600, "cadastrals": [], "caption": "Vendita Palazzo Presicce Acquarica", "category": {"id": 20, "name": "Palazzi - Edifici"}, "conditionId": 5, "ga4Condition": "Da ristrutturare", "condition": "Da ristrutturare", "costs": {"appliedVat": null, "agencyCommission": null, "commissionSubject": null, "notaryCommission": null}, "description": "Vendita Palazzo Presicce Acquarica\nIl Palazzo storico sorge nel cuore del centro storico di Presicce, nel comune di Presicce Acquarica, a due passi dalla chiesa di Sant’Andrea Apostolo e della famosa piazza che, nel 2017, ospitò lo spot pubblicitario della Ferrero Rocker diventando icona di stile nazionale. Il maestoso complesso immobiliare, con area pertinenziale annessa, si sviluppa su due piani. Realizzato in stile barocco, intorno al 1600, ha subito interventi di ampliamento intorno agli anni Novecento. La facciata storica è stata sottoposta, recentemente, a restauro conservativo. Il Palazzo storico è totalmente indipendente e vanta superfici molto ampie che coprono un’area coperta di circa 450 mq più corte esclusiva e piccolo androne scoperto su strada.\n\nÈ possibile intervenire demolendo vecchi depositi al fine di realizzare un giardino o un’ulteriore area di pertinenza utile.\n\nA tipizzare gli ambienti interni sono le caratteristiche volte tradizionali, prevalentemente a stella. I vani, in tutto, sono più di 15 alcuni originari, risalenti al Seicento, altri più recenti.\n\nI pavimenti con Cementine decorate e colorate, si sono conservati in ottimo stato e rappresentano un valore aggiunto.\n\nLo stato di conservazione del Palazzo\nL’immobile necessita di una ristrutturazione totale benché, come anticipato, la facciata sia stata già recuperata. Trattandosi di un palazzo storico, è possibilità accedere a dei finanziamenti previsti dal Titolo II della Regione Puglia per il recupero di immobili di questo tipo da adibire e destinate a strutture ricettive con agevolazioni a fondo perduto sia per la ristrutturazione del bene sia per l’acquisto.\n\nPosizione particolarmente pregiata\nIl palazzo storico si trova a Presicce nel cuore del centro storico, si affaccia su Corso Italia e fa angolo con via Pimente. Presicce è una delle due località che compongono il comune di Presicce-Acquarica ed è anche uno dei Borghi più Belli d’Italia. La cittadina del Basso Salento, si sviluppa nell’entroterra e vanta una storia ricca ed affascinante. Dista pochi chilometri dal mare e fa parte di quella ampia fascia salentina che prende il nome di Capo di Leuca.", "defaultDescription": "Vendita Palazzo Presicce Acquarica\nIl Palazzo storico sorge nel cuore del centro storico di Presicce, nel comune di Presicce Acquarica, a due passi dalla chiesa di Sant’Andrea Apostolo e della famosa piazza che, nel 2017, ospitò lo spot pubblicitario della Ferrero Rocker diventando icona di stile nazionale. Il maestoso complesso immobiliare, con area pertinenziale annessa, si sviluppa su due piani. Realizzato in stile barocco, intorno al 1600, ha subito interventi di ampliamento intorno agli anni Novecento. La facciata storica è stata sottoposta, recentemente, a restauro conservativo. Il Palazzo storico è totalmente indipendente e vanta superfici molto ampie che coprono un’area coperta di circa 450 mq più corte esclusiva e piccolo androne scoperto su strada.\n\nÈ possibile intervenire demolendo vecchi depositi al fine di realizzare un giardino o un’ulteriore area di pertinenza utile.\n\nA tipizzare gli ambienti interni sono le caratteristiche volte tradizionali, prevalentemente a stella. I vani, in tutto, sono più di 15 alcuni originari, risalenti al Seicento, altri più recenti.\n\nI pavimenti con Cementine decorate e colorate, si sono conservati in ottimo stato e rappresentano un valore aggiunto.\n\nLo stato di conservazione del Palazzo\nL’immobile necessi
