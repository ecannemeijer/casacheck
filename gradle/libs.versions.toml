navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
work = "2.10.0"
camerax = "1.4.1"
coil = "2.7.0"
okhttp = "4.12.0"
jsoup = "1.18.3"
mlkitText = "16.0.1"
mlkitTranslate = "17.0.3"
mlkitLangId = "17.0.6"
serialization = "1.7.3"
