junit = "4.13.2"
androidxJunit = "1.2.1"
espresso = "3.6.1"
androidxTest = "1.6.1"
truth = "1.4.4"
exifinterface = "1.3.7"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
